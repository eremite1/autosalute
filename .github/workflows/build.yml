name: Crea APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Compila
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rinomina
        run: cp app/build/outputs/apk/release/app-release.apk AutoSalute.apk
      - name: Pubblica
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: AutoSalute 1.0.${{ github.run_number }}
          files: AutoSalute.apk
          make_latest: true
